{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- Latest compiled and minified CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Latest compiled JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="{% static 'css/custom.css' %}" />

</head>

<body>
  {% include "inc/menu.html" %}
  <!-- <img class="banner" src="{% static 'images/b.jpg' %}"/> -->

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>Prediction</h2>
        <form action="/pred/" method="post">

          {% csrf_token %}
          <div class="mb-3">
            <label for="radius_mean" class="form-label">Radius Mean</label>
            <input type="number" step="any" class="form-control" id="radius_mean" name="radius_mean"
              placeholder="Enter radius mean" required>
          </div>

          <div class="mb-3">
            <label for="texture_mean" class="form-label">Texture Mean</label>
            <input type="number" step="any" class="form-control" id="texture_mean" name="texture_mean"
              placeholder="Enter texture mean" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary rounded-pill">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <p class="footer">
    🩺 Early Detection. Better Care.<br>
    © 2026 Cancer Detection Platform
  </p>
</body>

</html>
